name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    # 包声明支持 macOS Bash 3.2；空数组 nounset、UTF-8 locale 中文测试名等坑只在 macOS 复现，
    # 因此除 Linux 外同时跑一个 macOS runner 守护。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bats shellcheck ripgrep
          else
            brew install bats-core shellcheck ripgrep
          fi

      - name: Pack validation
        run: bash scripts/validate-pack.sh

      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck -x \
            update.sh \
            scripts/*.sh \
            skills/ssf-plan/scripts/*.sh \
            tests/lib/*.bash

      - name: Test suite
        run: bash scripts/test.sh

      - name: Non-default TMPDIR validation
        run: |
          tmpdir="$RUNNER_TEMP/superspecflow tmp"
          mkdir -p "$tmpdir"
          TMPDIR="$tmpdir/" bash scripts/validate-pack.sh
          TMPDIR="$tmpdir/" bash scripts/test.sh

      # 检查 PR / push 的真实提交范围，不能用 clean checkout 与 HEAD 的空 diff 代替。
      - name: Whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bash scripts/check-commit-whitespace.sh "$BASE_SHA" "$HEAD_SHA" --merge-base
          else
            bash scripts/check-commit-whitespace.sh "$BASE_SHA" "$HEAD_SHA"
          fi
