name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    # 包声明支持 macOS Bash 3.2；空数组 nounset、UTF-8 locale 中文测试名等坑只在 macOS 复现，
    # 因此除 Linux 外同时跑一个 macOS runner 守护。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bats shellcheck ripgrep
          else
            brew install bats-core shellcheck ripgrep
          fi

      - name: Pack validation
        run: bash scripts/validate-pack.sh

      - name: Test suite
        run: bash scripts/test.sh

      - name: Non-default TMPDIR validation
        run: |
          tmpdir="$RUNNER_TEMP/superspecflow tmp"
          mkdir -p "$tmpdir"
          TMPDIR="$tmpdir/" bash scripts/validate-pack.sh
          TMPDIR="$tmpdir/" bash scripts/test.sh

      - name: Shellcheck
        run: |
          shellcheck -x \
            update.sh \
            scripts/*.sh \
            tests/lib/*.bash

      # 仓库纪律要求提交前跑 git diff --check，CI 同步守护尾随空格等空白问题。
      - name: Whitespace check
        run: git diff --check HEAD
